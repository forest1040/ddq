[project]
name = "ddq"
version = "0.1.0"
description = "Distributed quantum circuit simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
]

[project.optional-dependencies]
mpi = ["mpi4py>=4.1.1"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svsim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
